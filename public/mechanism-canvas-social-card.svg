<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">Mechanism Canvas social card</title>
  <desc id="description">A learner-owned chemistry canvas where an agent tests electron-flow paths, the page checks them, and the learner chooses what reaches the draft.</desc>

  <rect width="1800" height="1200" fill="#F5F0E5"/>
  <rect width="650" height="1200" fill="#183F4D"/>
  <rect x="650" width="10" height="1200" fill="#FFDF7E"/>

  <!-- Brand -->
  <circle cx="124" cy="116" r="46" fill="#F5F0E5"/>
  <text x="109" y="135" fill="#183F4D" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="48" font-weight="700">e</text>
  <text x="139" y="103" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="700">−</text>
  <text x="194" y="131" fill="#F5F0E5" font-family="Avenir Next, Arial, sans-serif" font-size="40" font-weight="700">Mechanism Canvas</text>

  <!-- Core promise -->
  <text x="86" y="284" fill="#FFDF7E" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">A SAFE PLACE TO TEST</text>
  <text x="84" y="408" fill="#F5F0E5" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="82" font-weight="700">Wrong turns</text>
  <text x="84" y="520" fill="#F5F0E5" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="82" font-weight="700">stay off</text>
  <text x="84" y="632" fill="#F5F0E5" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="82" font-weight="700">your draft.</text>

  <circle cx="96" cy="714" r="9" fill="#FFDF7E"/>
  <circle cx="124" cy="714" r="9" fill="#FFDF7E"/>
  <line x1="151" y1="714" x2="310" y2="714" stroke="#7DA3A1" stroke-width="3"/>
  <text x="86" y="792" fill="#DCEEEA" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="500">The agent explores competing paths.</text>
  <text x="86" y="842" fill="#DCEEEA" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="500">The page checks the chemistry.</text>
  <text x="86" y="892" fill="#DCEEEA" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="500">You make the move.</text>

  <text x="86" y="1110" fill="#B8D3CF" font-family="Avenir Next, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.5">WEBMCP CHALLENGE · 2026</text>

  <!-- Product frame -->
  <text x="730" y="119" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600">A learner-owned WebMCP chemistry canvas</text>
  <line x1="730" y1="166" x2="1708" y2="166" stroke="#A6C1BC" stroke-width="2"/>
  <text x="730" y="254" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="52" font-weight="700">Agent tests. Page checks. You decide.</text>
  <text x="730" y="338" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">CHECKED ELECTRON FLOW</text>

  <!-- SN2 mechanism -->
  <line x1="1308" y1="512" x2="1451" y2="512" stroke="#315E63" stroke-width="10" stroke-linecap="round"/>

  <circle cx="882" cy="512" r="68" fill="#FFFFFF" stroke="#6C918D" stroke-width="4"/>
  <circle cx="1240" cy="512" r="74" fill="#FFFFFF" stroke="#6C918D" stroke-width="4"/>
  <circle cx="1524" cy="512" r="70" fill="#FFFFFF" stroke="#6C918D" stroke-width="4"/>

  <text x="855" y="535" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="58" font-weight="800">O</text>
  <text x="1215" y="535" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="58" font-weight="800">C</text>
  <text x="1484" y="535" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="51" font-weight="800">Br</text>
  <text x="921" y="458" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="34" font-weight="700">−</text>
  <circle cx="954" cy="458" r="10" fill="#183F4D"/>
  <circle cx="978" cy="444" r="10" fill="#183F4D"/>

  <!-- Explicit attack arrow: shaft and joined head -->
  <path d="M 993 441 C 1065 374, 1157 381, 1196 428" fill="none" stroke="#C94D38" stroke-width="14" stroke-linecap="round"/>
  <polygon points="1221,456 1184,441 1205,410" fill="#C94D38"/>

  <!-- Explicit bond-cleavage arrow: shaft and joined head -->
  <path d="M 1388 524 C 1400 627, 1474 658, 1504 578" fill="none" stroke="#76507E" stroke-width="14" stroke-linecap="round"/>
  <polygon points="1518,549 1490,578 1525,585" fill="#76507E"/>

  <line x1="730" y1="690" x2="770" y2="690" stroke="#C94D38" stroke-width="8" stroke-linecap="round"/>
  <text x="792" y="700" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="26" font-weight="600">bond forms</text>
  <line x1="1000" y1="690" x2="1040" y2="690" stroke="#76507E" stroke-width="8" stroke-linecap="round"/>
  <text x="1062" y="700" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="26" font-weight="600">bond breaks</text>
  <text x="1378" y="700" fill="#183F4D" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="28" font-weight="700">one elementary step</text>

  <!-- Learner gate -->
  <rect x="730" y="790" width="978" height="294" rx="34" fill="#DCEEEA"/>
  <rect x="730" y="790" width="14" height="294" rx="7" fill="#FFDF7E"/>
  <text x="780" y="850" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">THE LEARNER'S GATE</text>
  <text x="780" y="928" fill="#183F4D" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="48" font-weight="700">Only you move a checked path</text>
  <text x="780" y="988" fill="#183F4D" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="48" font-weight="700">onto the canvas.</text>

  <text x="780" y="1044" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AGENT TESTS</text>
  <line x1="922" y1="1038" x2="997" y2="1038" stroke="#7DA3A1" stroke-width="3"/>
  <polygon points="1009,1038 995,1030 995,1046" fill="#7DA3A1"/>
  <text x="1035" y="1044" fill="#315E63" font-family="Avenir Next, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PAGE CHECKS</text>
  <line x1="1197" y1="1038" x2="1272" y2="1038" stroke="#7DA3A1" stroke-width="3"/>
  <polygon points="1284,1038 1270,1030 1270,1046" fill="#7DA3A1"/>
  <circle cx="1434" cy="1038" r="28" fill="#FFDF7E"/>
  <path d="M 1420 1038 L 1431 1049 L 1450 1026" fill="none" stroke="#183F4D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1478" y="1044" fill="#183F4D" font-family="Avenir Next, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">YOU CHOOSE</text>
</svg>
